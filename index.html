<!DOCTYPE html>

  <title>Kit SpinnerSuKa 3D</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(255,255,255,0.85);
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="info">
  Kit SpinnerSuKa 3D — Halakan kamera pada gambar mulut
</div>

  color-space="sRGB"

  device-orientation-permission-ui="enabled: false">

  <!-- MODEL 1 -->

      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">

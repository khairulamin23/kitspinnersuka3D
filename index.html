<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kit SpinnerSuKa 3D</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      text-align: center;
    }

    h1 {
      margin: 20px 10px 5px;
    }

    p {
      margin: 5px 10px 15px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <h1>Kit SpinnerSuKa 3D</h1>

  <p>
    Gerakkan model untuk melihat bentuk mulut 3D.
  </p>

  <model-viewer
    src="kit spinnersuka 1 final.glb"
    alt="Model Mulut 3D Kit SpinnerSuKa"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look">
  </model-viewer>

</body>
</html>

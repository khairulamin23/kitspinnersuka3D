<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kit SpinnerSuKa 3D</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(255,255,255,0.85);
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="info">
  Kit SpinnerSuKa 3D — Halakan kamera pada gambar mulut
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <a-asset-item
      id="mulut1"
      src="./kit spinnersuka 1 final.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut2"
      src="./MODEL 2.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut3"
      src="./mulut 3a.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut4"
      src="./mulut 4a.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut5"
      src="./mulut 5a.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut6"
      src="./mulut 6a.glb">
    </a-asset-item>

    <a-asset-item
      id="mulut7"
      src="./mulut 7a.glb">
    </a-asset-item>

  </a-assets>


  <!-- MODEL 1 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      src="#mulut1"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 2 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model
      src="#mulut2"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 3 -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model
      src="#mulut3"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 4 -->
  <a-entity mindar-image-target="targetIndex: 3">
    <a-gltf-model
      src="#mulut4"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 5 -->
  <a-entity mindar-image-target="targetIndex: 4">
    <a-gltf-model
      src="#mulut5"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 6 -->
  <a-entity mindar-image-target="targetIndex: 5">
    <a-gltf-model
      src="#mulut6"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <!-- MODEL 7 -->
  <a-entity mindar-image-target="targetIndex: 6">
    <a-gltf-model
      src="#mulut7"
      position="0 0 0.1"
      rotation="0 360 0"
      scale="0.5 0.5 0.5">
    </a-gltf-model>
  </a-entity>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

</a-scene>

</body>
</html>
